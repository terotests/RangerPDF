# The online viewer on GitHub Pages: viewer/build.sh's output pushed to the
# gh-pages branch on every push to main (Settings > Pages: Deploy from a
# branch, gh-pages, / (root)).
name: viewer-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the viewer
        run: |
          rustup target add wasm32-unknown-unknown
          viewer/build.sh "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - name: Push to gh-pages
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "viewer from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
